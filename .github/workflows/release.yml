name: Release Electron App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd examples/electron
          npm version "$VERSION" --no-git-tag-version

      - name: Install and build SDK packages
        run: |
          npm install
          npm run build -w @claude-auth-sdk/core
          npm run build -w @claude-auth-sdk/react

      - name: Reinstall app-builder-bin with platform binaries
        shell: bash
        run: |
          rm -rf node_modules/app-builder-bin
          npm install app-builder-bin

      - name: Replace workspace symlinks with copies
        shell: bash
        run: |
          for pkg in node_modules/@claude-auth-sdk/core node_modules/@claude-auth-sdk/react; do
            if [ -L "$pkg" ]; then
              target=$(readlink -f "$pkg")
              rm "$pkg"
              cp -r "$target" "$pkg"
            fi
          done

      - name: Build Electron app
        working-directory: examples/electron
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            examples/electron/release/*.dmg
            examples/electron/release/*.exe
            examples/electron/release/*.AppImage
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
